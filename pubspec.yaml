name: ryto_customer
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private package.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Inputs
  intl_phone_number_field: ^0.2.1
  otp_text_field: ^1.1.3
  flutter_typeahead: ^6.0.0
  table_calendar: ^3.1.2

  # Navigation
  go_router: ^17.1.0

  # File management
  flutter_svg: ^2.2.3
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  # Scrollable
  group_list_view: ^1.1.1
  grouped_list: ^6.0.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # Network client
  retrofit: ^4.9.0
  socket_io_client: ^3.1.4
  dio: ^5.9.2

  # Logging/Monitoring
  logger: ^2.6.0
  json_annotation: ^4.9.0

  # State management
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0

  # Loader
  shimmer: ^3.0.0

  # Storage
  flutter_secure_storage: ^10.0.0

  # Location/Maps
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.10.0
  google_map_dynamic_key: ^1.0.1

  # Secrets
  flutter_dotenv: ^6.0.0

  equatable: ^2.0.8
  collection: ^1.19.1
  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.5
  uuid: ^4.5.3

  # Payment
  flutter_stripe: ^12.6.0

  # Auth/SSO
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0


flutter:
  uses-material-design: true

  assets:
   - assets/icons/
   - assets/images/
   - assets/logos/
   - assets/logos/currency/
   - assets/svgs/
   - assets/countries/
   - .env

  fonts:
    - family: HostGrotesk
      fonts:
        - asset: assets/fonts/HostGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/HostGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HostGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HostGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/HostGrotesk-Black.ttf
          weight: 900
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
